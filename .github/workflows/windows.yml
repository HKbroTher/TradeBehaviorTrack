name: Windows validation

on:
  push:
    branches: [feat/behavioral-guard-detector]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python simulation checks
        run: |
          python -m unittest -v
          python evaluate.py
      - name: Build mouse collector executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --name BehavioralGuardMouse capture_mouse.py
          python -m PyInstaller --onefile --name BehavioralGuardSmoke smoke_windows.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend build
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows desktop type check
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: Build Windows desktop installer
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: behavioral-guard-windows-prototypes
          path: |
            dist/BehavioralGuardMouse.exe
            dist/BehavioralGuardSmoke.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
